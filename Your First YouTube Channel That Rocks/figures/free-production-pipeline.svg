<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" font-family="'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="1600" height="720" fill="#FFFFFF"/>

  <text x="800" y="48" text-anchor="middle" font-size="36" font-weight="700" fill="#1E293B">The default stack</text>
  <text x="800" y="82" text-anchor="middle" font-size="20" fill="#64748B">Finish the video with these four. Open a generator only when they cannot make the shot.</text>

  <!-- 1 Voice -->
  <rect x="36" y="112" width="350" height="300" rx="16" fill="#FDF2F8"/>
  <rect x="36" y="112" width="350" height="78" rx="16" fill="#DB2777"/>
  <rect x="36" y="158" width="350" height="32" fill="#DB2777"/>
  <text x="211" y="148" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">1</text>
  <text x="211" y="176" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">Voice</text>
  <text x="211" y="250" text-anchor="middle" font-size="20" fill="#1E293B">Your own voice,</text>
  <text x="211" y="282" text-anchor="middle" font-size="20" fill="#1E293B">or text-to-speech.</text>
  <text x="211" y="330" text-anchor="middle" font-size="18" fill="#9D174D">Not a clone of someone else.</text>

  <path d="M 388 250 L 410 264 L 388 278 Z" fill="#94A3B8"/>

  <!-- 2 Music -->
  <rect x="422" y="112" width="350" height="300" rx="16" fill="#FFFBEB"/>
  <rect x="422" y="112" width="350" height="78" rx="16" fill="#D97706"/>
  <rect x="422" y="158" width="350" height="32" fill="#D97706"/>
  <text x="597" y="148" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">2</text>
  <text x="597" y="176" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">Music</text>
  <text x="597" y="266" text-anchor="middle" font-size="20" fill="#1E293B">One track from</text>
  <text x="597" y="298" text-anchor="middle" font-size="20" fill="#1E293B">YouTube Audio Library</text>

  <path d="M 774 250 L 796 264 L 774 278 Z" fill="#94A3B8"/>

  <!-- 3 Edit -->
  <rect x="808" y="112" width="350" height="300" rx="16" fill="#F5F3FF"/>
  <rect x="808" y="112" width="350" height="78" rx="16" fill="#7C3AED"/>
  <rect x="808" y="158" width="350" height="32" fill="#7C3AED"/>
  <text x="983" y="148" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">3</text>
  <text x="983" y="176" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">Edit</text>
  <text x="983" y="266" text-anchor="middle" font-size="20" fill="#1E293B">CapCut.</text>
  <text x="983" y="298" text-anchor="middle" font-size="20" fill="#1E293B">Export the whole length.</text>

  <path d="M 1160 250 L 1182 264 L 1160 278 Z" fill="#94A3B8"/>

  <!-- 4 Footage -->
  <rect x="1194" y="112" width="370" height="300" rx="16" fill="#ECFDF5"/>
  <rect x="1194" y="112" width="370" height="78" rx="16" fill="#059669"/>
  <rect x="1194" y="158" width="370" height="32" fill="#059669"/>
  <text x="1379" y="148" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">4</text>
  <text x="1379" y="176" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">Footage</text>
  <text x="1379" y="250" text-anchor="middle" font-size="20" fill="#1E293B">Filmed, drawn,</text>
  <text x="1379" y="282" text-anchor="middle" font-size="20" fill="#1E293B">or photographed,</text>
  <text x="1379" y="330" text-anchor="middle" font-size="18" fill="#065F46">or one licensed clip.</text>

  <!-- Side door -->
  <rect x="36" y="440" width="1528" height="120" rx="16" fill="#EFF4FF" stroke="#2563EB" stroke-width="2"/>
  <text x="800" y="488" text-anchor="middle" font-size="22" font-weight="700" fill="#1E40AF">Side door. Section I, only when the four above cannot make the shot.</text>
  <text x="800" y="526" text-anchor="middle" font-size="20" fill="#1E293B">Sora 2, InVideo, or Magic Hour. Read that tool’s license before you publish.</text>

  <!-- License -->
  <rect x="36" y="584" width="1528" height="100" rx="16" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="800" y="626" text-anchor="middle" font-size="22" font-weight="700" fill="#78350F">A free tool is not permission to monetize the result.</text>
  <text x="800" y="658" text-anchor="middle" font-size="19" fill="#78350F">Read the license page before you publish.</text>
</svg>
