name: Validate manuscript files

on:
  pull_request:
    paths:
      - "**/*.docx"

permissions:
  contents: read

jobs:
  validate-docx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: pip install python-docx

      - run: |
          git fetch origin "$GITHUB_BASE_REF" --depth=1
          python .github/scripts/validate_docx.py --base "origin/$GITHUB_BASE_REF"
