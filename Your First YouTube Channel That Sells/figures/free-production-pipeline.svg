  <text x="1414" y="182" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">V</text>
  <text x="1414" y="212" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">Edit &amp; Export</text>
  <rect x="1296" y="256" width="236" height="56" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="1414" y="290" text-anchor="middle" font-size="19" fill="#1E293B">CapCut</text>
  <rect x="1296" y="332" width="236" height="56" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="1414" y="366" text-anchor="middle" font-size="19" fill="#1E293B">123apps</text>
  <rect x="1296" y="408" width="236" height="56" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="1414" y="442" text-anchor="middle" font-size="19" fill="#1E293B">FFmpeg</text>

  <!-- Warning banner -->
  <rect x="40" y="592" width="1516" height="100" rx="16" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="798" y="632" text-anchor="middle" font-size="23" font-weight="700" fill="#78350F">Free tool ≠ free to use commercially.</text>
  <text x="798" y="664" text-anchor="middle" font-size="19" fill="#78350F">Read the license page before you publish — not just the price page.</text>
</svg>
