<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 712" font-family="'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="1600" height="712" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="800" y="52" text-anchor="middle" font-size="40" font-weight="700" fill="#1E293B">The Free Production Pipeline</text>
  <text x="800" y="86" text-anchor="middle" font-size="20" fill="#64748B">Five jobs a first video needs done — and a free tool for each one</text>

  <!-- ===== Card definitions ===== -->
  <!-- Card 1: Generate Footage -->
  <clipPath id="card0"><rect x="40" y="140" width="284" height="420" rx="18"/></clipPath>
  <g clip-path="url(#card0)">
    <rect x="40" y="140" width="284" height="420" fill="#EFF4FF"/>
    <rect x="40" y="140" width="284" height="90" fill="#2563EB"/>
  </g>
  <text x="182" y="182" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">I</text>
  <text x="182" y="212" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">Generate Footage</text>
  <rect x="64" y="256" width="236" height="56" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="182" y="290" text-anchor="middle" font-size="19" fill="#1E293B">Sora 2</text>
  <rect x="64" y="332" width="236" height="56" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="182" y="366" text-anchor="middle" font-size="19" fill="#1E293B">InVideo</text>
  <rect x="64" y="408" width="236" height="56" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="182" y="442" text-anchor="middle" font-size="19" fill="#1E293B">Magic Hour</text>

  <!-- Arrow 1 -->
  <path d="M 326 336 L 348 350 L 326 364 Z" fill="#94A3B8"/>

  <!-- Card 2: Stock Footage & Photos -->
  <clipPath id="card1"><rect x="348" y="140" width="284" height="420" rx="18"/></clipPath>
  <g clip-path="url(#card1)">
    <rect x="348" y="140" width="284" height="420" fill="#ECFDF5"/>
    <rect x="348" y="140" width="284" height="90" fill="#059669"/>
  </g>
  <text x="490" y="182" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">II</text>
  <text x="490" y="212" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">Stock Footage &amp; Photos</text>
  <rect x="372" y="256" width="236" height="56" rx="12" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
  <text x="490" y="290" text-anchor="middle" font-size="19" fill="#1E293B">Pexels</text>
  <rect x="372" y="332" width="236" height="56" rx="12" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
  <text x="490" y="366" text-anchor="middle" font-size="19" fill="#1E293B">Pixabay</text>
  <rect x="372" y="408" width="236" height="56" rx="12" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
  <text x="490" y="442" text-anchor="middle" font-size="19" fill="#1E293B">Mixkit</text>

  <!-- Arrow 2 -->
  <path d="M 634 336 L 656 350 L 634 364 Z" fill="#94A3B8"/>

  <!-- Card 3: Music & Sound -->
  <clipPath id="card2"><rect x="656" y="140" width="284" height="420" rx="18"/></clipPath>
  <g clip-path="url(#card2)">
    <rect x="656" y="140" width="284" height="420" fill="#FFFBEB"/>
    <rect x="656" y="140" width="284" height="90" fill="#D97706"/>
