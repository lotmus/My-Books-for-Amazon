  <text x="798" y="182" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">III</text>
  <text x="798" y="212" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">Music &amp; Sound</text>
  <rect x="680" y="256" width="236" height="56" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
  <text x="798" y="290" text-anchor="middle" font-size="17" fill="#1E293B">YouTube Audio Library</text>
  <rect x="680" y="332" width="236" height="56" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
  <text x="798" y="366" text-anchor="middle" font-size="19" fill="#1E293B">FreePD</text>
  <rect x="680" y="408" width="236" height="56" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
  <text x="798" y="442" text-anchor="middle" font-size="19" fill="#1E293B">Incompetech</text>

  <!-- Arrow 3 -->
  <path d="M 942 336 L 964 350 L 942 364 Z" fill="#94A3B8"/>

  <!-- Card 4: Voice -->
  <clipPath id="card3"><rect x="964" y="140" width="284" height="420" rx="18"/></clipPath>
