    <rect x="964" y="140" width="284" height="420" fill="#FDF2F8"/>
    <rect x="964" y="140" width="284" height="90" fill="#DB2777"/>
  </g>
  <text x="1106" y="182" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">IV</text>
  <text x="1106" y="212" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">Voice</text>
  <rect x="988" y="256" width="236" height="56" rx="12" fill="#FFFFFF" stroke="#DB2777" stroke-width="2"/>
  <text x="1106" y="290" text-anchor="middle" font-size="19" fill="#1E293B">FineVoice</text>
  <rect x="988" y="332" width="236" height="56" rx="12" fill="#FFFFFF" stroke="#DB2777" stroke-width="2"/>
  <text x="1106" y="366" text-anchor="middle" font-size="19" fill="#1E293B">Revoicer</text>
  <rect x="988" y="408" width="236" height="56" rx="12" fill="#FFFFFF" stroke="#DB2777" stroke-width="2"/>
  <text x="1106" y="442" text-anchor="middle" font-size="19" fill="#1E293B">Turboscribe</text>

  <!-- Arrow 4 -->
  <path d="M 1250 336 L 1272 350 L 1250 364 Z" fill="#94A3B8"/>

  <!-- Card 5: Edit & Export -->
  <clipPath id="card4"><rect x="1272" y="140" width="284" height="420" rx="18"/></clipPath>
  <g clip-path="url(#card4)">
    <rect x="1272" y="140" width="284" height="420" fill="#F5F3FF"/>
    <rect x="1272" y="140" width="284" height="90" fill="#7C3AED"/>
