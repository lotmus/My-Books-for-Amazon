# .github/workflows/firmware.yml: build the firmware and run the host tests on every push.
name: firmware
on: [push, pull_request]

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests on the host
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -o test_ringbuf test/test_ringbuf.c src/ringbuf.c
          ./test_ringbuf

  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3
    steps:
      - uses: actions/checkout@v4
      - name: Build for the ESP32-S3
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py build
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: build/*.bin
